[package]
name = "already-tested"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Skip duplicate CI with trusted, content-matched local-test claims."
license = "MIT"
repository = "https://github.com/dblock/already-tested"
homepage = "https://github.com/dblock/already-tested"
documentation = "https://github.com/dblock/already-tested/blob/master/DESIGN.md"
keywords = ["ci", "github-actions", "testing", "agents"]
categories = ["command-line-utilities", "development-tools::testing"]
include = ["src/**", "tests/**", "assets/logo.svg", "action.yml", "scripts/**", ".cargo/config.toml", "*.md", "LICENSE", "Cargo.lock"]
default-run = "already-tested"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/trailofbits/dylint", rev = "4723dd08bff96c8f5589e1df9f7460fac6458b9e", pattern = "examples/general" },
    { git = "https://github.com/dblock/dylint-spellcheck", rev = "6dab27c9cc08f9f895770d7bbd733971987739ee" },
]

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dylint_lib, values("general"))'] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
