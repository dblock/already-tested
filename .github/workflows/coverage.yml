name: Coverage
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  coverage:
    name: Coverage on ${{ matrix.entry.os }}
    runs-on: ${{ matrix.entry.os }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest }
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: coverage-${{ matrix.entry.os }}
      - name: Install Coverage Tool
        run: cargo install --locked cargo-llvm-cov --version 0.9.1
      - name: Collect Coverage
        run: cargo llvm-cov --locked --workspace --all-targets --all-features --lcov --output-path lcov.info
      - name: Upload Coverage
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ github.token }}
          file: lcov.info
          format: lcov
          flag-name: ${{ matrix.entry.os }}
          parallel: true
  coverage-finished:
    name: Finish Coverage
    if: always()
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Finish Parallel Coverage
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ github.token }}
          parallel-finished: true
