name: Test
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  test:
    name: Test on ${{ matrix.entry.os }}
    runs-on: ${{ matrix.entry.os }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest }
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check Local CI Claim
        id: local
        uses: ./
        with:
          check: test-${{ matrix.entry.os }}
      - name: Set Up Rust
        if: steps.local.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - name: Cache Rust Dependencies
        if: steps.local.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: test-${{ matrix.entry.os }}
      - name: Run Tests
        if: steps.local.outputs.skip != 'true'
        run: cargo test --locked --workspace --all-targets
