name: Lint
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  lint:
    name: Format, Clippy, and Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check Local CI Claim
        id: local
        uses: ./
        with:
          check: lint
      - name: Set Up Rust
        if: steps.local.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - name: Cache Rust Dependencies
        if: steps.local.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: lint
      - name: Check Rust Formatting
        if: steps.local.outputs.skip != 'true'
        run: cargo fmt --all -- --check
      - name: Run Clippy
        if: steps.local.outputs.skip != 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check Documentation and Shell Scripts
        if: steps.local.outputs.skip != 'true'
        run: cargo xtask docs
  dylint:
    name: Dylint
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check Local CI Claim
        id: local
        uses: ./
        with:
          check: dylint
      - name: Set Up Rust
        if: steps.local.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - name: Cache Rust Dependencies
        if: steps.local.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: dylint
      - name: Cache Dylint Tooling
        if: steps.local.outputs.skip != 'true'
        id: dylint-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.dylint_drivers
            ~/.rustup/toolchains/nightly-2026-08-20-x86_64-unknown-linux-gnu
            target/dylint/libraries
          key: dylint-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/lint.yml') }}
      - name: Install Dylint
        if: steps.local.outputs.skip != 'true' && steps.dylint-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          for tool in cargo-dylint dylint-link; do
            archive="$tool-x86_64-unknown-linux-gnu-v6.4.0.tar.gz"
            base=https://github.com/trailofbits/dylint/releases/download/v6.4.0
            curl -fsSL "$base/$archive" -o "$archive"
            curl -fsSL "$base/$archive.sha256" -o "$archive.sha256"
            read -r label expected extra < "$archive.sha256"
            [[ "$label" == "SHA2-256($archive)=" && "$expected" =~ ^[0-9a-f]{64}$ && -z "$extra" ]]
            printf '%s  %s\n' "$expected" "$archive" | sha256sum --check
            tar -xzf "$archive" --strip-components=1 "$tool-x86_64-unknown-linux-gnu-v6.4.0/$tool"
            install -m 755 "$tool" "$HOME/.cargo/bin/$tool"
          done
      - name: Run Dylint
        if: steps.local.outputs.skip != 'true'
        env:
          DYLINT_RUSTFLAGS: -D warnings
        run: cargo dylint --all --fail-on-no-libraries -- --locked --workspace --all-targets --all-features
